<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TSX — Times Square Exchange</title>
  <meta name="description" content="Times Square en 3D temps réel. Achetez des créneaux publicitaires sur les écrans géants, tradez votre temps d'antenne comme en bourse." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Unbounded:wght@500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <div id="app"></div>
  <div id="ui-root"></div>

  <div id="splash">
    <div class="splash-inner">
      <div class="splash-kicker">BIENVENUE AU CŒUR DE LA NUIT</div>
      <h1 class="splash-title">TIMES&nbsp;SQUARE<br /><span>EXCHANGE</span></h1>
      <p class="splash-sub">
        16 écrans géants. Un marché qui ne dort jamais.<br />
        Créez votre pub, achetez vos créneaux, tradez votre temps d'antenne.
      </p>
      <button id="enter-btn">ENTRER DANS LE SQUARE</button>
      <div class="splash-hint">Glissez pour pivoter · Molette pour zoomer · Cliquez un écran pour voir son cours</div>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
