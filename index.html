<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TSX — Times Square Exchange</title>
  <meta name="description" content="Times Square en 3D temps réel. Achetez des créneaux publicitaires sur les écrans géants, tradez votre temps d'antenne comme en bourse." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Inter pour l'interface ; Unbounded + Space Grotesk restent réservées
       aux visuels publicitaires dessinés en canvas -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;700&family=Unbounded:wght@500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <div id="app"></div>
  <div id="ui-root"></div>

  <div id="splash">
    <div class="splash-inner">
      <div class="splash-mark">TSX<span class="dot">.</span></div>
      <h1 class="splash-title">Times Square,<br />à votre nom.</h1>
      <p class="splash-sub">
        Une place, seize écrans, un marché.<br />
        Créez votre pub, achetez vos minutes d'antenne, revendez-les au bon moment.
      </p>
      <button id="enter-btn">Entrer sur la place</button>
      <div class="splash-hint">Glisser pour pivoter — molette pour zoomer — cliquer un écran pour voir son cours</div>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
